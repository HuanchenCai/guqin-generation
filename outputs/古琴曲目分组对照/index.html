<style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f5f1e9;color:#302b23;max-width:1100px;margin:auto;padding:28px}h1{font-size:28px}p{line-height:1.7}.note{background:#fff8e8;border-left:4px solid #bc8b4c;padding:12px 16px;margin:20px 0}.set{background:#fff;border:1px solid #ddd0b8;border-radius:16px;margin:18px 0;padding:20px;box-shadow:0 2px 9px #0001}.set h2{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.clip{background:#faf8f3;border:1px solid #e8ddcb;border-radius:10px;padding:12px}audio{width:100%;margin-top:5px}select,button{font:inherit;padding:7px 9px}label{display:block;margin:9px 0}.toolbar{position:sticky;top:0;background:#f5f1e9eF;padding:8px 0;z-index:2;display:flex;gap:9px;align-items:center;flex-wrap:wrap}small{color:#655d52}</style>
<h1>古琴续写 · 曲目分组对照</h1><p>同一曲目的录音不会同时出现在训练、验证或测试组。下面固定 10 秒原曲开头，让模型接 25 秒；各候选使用同一个开头、种子和生成设置。每段只需给一个总体分数，听到明显故障可勾选。</p>
<div class="note">A、B 是只用 329 首训练的可比对照，这里的曲目来自未参与训练的验证组。C 是随后用全部 412 首训练的模型，因此 C 对这些曲目属于已见数据，只供检查最终音色，不能当作未见曲目成绩。</div>

ignal": {"rms_dbfs": -18.71, "peak": 1.0, "clipped_fraction": 0.00019}}, {"variant": "C", "training": "412 首全量", "source": "validation_03.flac", "piece": "跃进歌声", "artist": "喻绍泽", "seed": 94017, "file": "v03_94017_C.flac", "checkpoint": "epoch=1-step=2764.ckpt", "generated_seconds": 5.38, "signal": {"rms_dbfs": -22.63, "peak": 0.7275, "clipped_fraction": 0.0}}, {"variant": "C", "training": "412 首全量", "source": "validation_04.flac", "piece": "广陵散", "artist": "姚丙炎", "seed": 84917, "file": "v04_84917_C.flac", "checkpoint": "epoch=1-step=2764.ckpt", "generated_seconds": 5.44, "signal": {"rms_dbfs": -22.98, "peak": 0.9585, "clipped_fraction": 0.0}}, {"variant": "C", "training": "412 首全量", "source": "validation_04.flac", "piece": "广陵散", "artist": "姚丙炎", "seed": 94017, "file": "v04_94017_C.flac", "checkpoint": "epoch=1-step=2764.ckpt", "generated_seconds": 5.47, "signal": {"rms_dbfs": -24.98, "peak": 0.6914, "clipped_fraction": 0.0}}], "contexts": [{"file": "validation_01.flac", "分组": "validation", "反馈来源": "明确评分", "归一曲目": "长清", "演奏者": "张子谦", "曲名": "长清1", "Y盘相对路径": "CD第2册\\28\\张子谦-长清1.wav", "前奏起点秒": "36", "前奏长度秒": "10"}, {"file": "validation_02.flac", "分组": "validation", "反馈来源": "明确评分", "归一曲目": "关山月", "演奏者": "刘景韶", "曲名": "关山月", "Y盘相对路径": "CD第2册\\35\\刘景韶-关山月.wav", "前奏起点秒": "44", "前奏长度秒": "10"}, {"file": "validation_03.flac", "分组": "validation", "反馈来源": "用户指定：1–400 待判断均可用", "归一曲目": "跃进歌声", "演奏者": "喻绍泽", "曲名": "跃进歌声1", "Y盘相对路径": "CD第2册\\38\\喻绍泽-跃进歌声1.wav", "前奏起点秒": "151", "前奏长度秒": "10"}, {"file": "validation_04.flac", "分组": "validation", "反馈来源": "用户指定：1–400 待判断均可用", "归一曲目": "广陵散", "演奏者": "姚丙炎", "曲名": "广陵散", "Y盘相对路径": "CD第4册\\66\\姚丙炎-广陵散.wav", "前奏起点秒": "14", "前奏长度秒": "10"}]};const KEY='guqin_piece_comparison_v1';const ratings=JSON.parse(localStorage.getItem(KEY)||'{}');const save=()=>{localStorage.setItem(KEY,JSON.stringify(ratings));document.getElementById('progress').textContent=`已评分 ${Object.values(ratings).filter(x=>x.score).length}/${DATA.rows.length} 段`};const mount=document.getElementById('mount');for(const [i,source] of DATA.contexts.entries()){if(source['分组']!=='validation')continue;for(const seed of [84917,94017]){const cards=DATA.rows.filter(r=>r.source===source.file&&r.seed===seed);const box=document.createElement('section');box.className='set';box.innerHTML=`<h2>${source['归一曲目']} · 种子 ${seed}</h2><small>${source['演奏者']}演奏的原曲开头；候选前 10 秒均为同一开头</small><label>原曲 10 秒 <audio controls preload="none" src="audio/${source.file}"></audio></label><div class="grid"></div>`;const grid=box.querySelector('.grid');for(const row of cards){const id=`${row.source}|${row.seed}|${row.variant}`;const entry=ratings[id]||{};const card=document.createElement('div');card.className='clip';card.innerHTML=`<strong>候选 ${row.variant}</strong><audio controls preload="none" src="audio/${row.file}"></audio><label>总体评分 <select><option value="">待评分</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n} / 5</option>`).join('')}</select></label><label><input type="checkbox"> 明显杂音、机械音或重复</label>`;const sel=card.querySelector('select'),check=card.querySelector('input');sel.value=entry.score||'';check.checked=!!entry.fault;sel.onchange=()=>{ratings[id]={score:Number(sel.value)||null,fault:check.checked};save()};check.onchange=sel.onchange;grid.append(card)}mount.append(box)}}document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'guqin-piece-comparison-v1',ratings,generated_at:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='古琴曲目分组统一评分.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('reveal').onclick=()=>alert('A：官方默认遮蔽（随机/全遮蔽/续写 10/80/10）\nB：偏重前缀续写（10/30/60）\nC：全部 412 首训练，采用 10/30/60');save();</script></html>
